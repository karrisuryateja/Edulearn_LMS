<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Registration Test</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <div class="container mt-5">
    <h1>Registration Test</h1>
    
    <form id="testForm">
      <div class="mb-3">
        <label for="name" class="form-label">Name:</label>
        <input type="text" class="form-control" id="name" value="Test User">
      </div>
      
      <div class="mb-3">
        <label for="email" class="form-label">Email:</label>
        <input type="email" class="form-control" id="email" value="test@example.com">
      </div>
      
      <div class="mb-3">
        <label for="password" class="form-label">Password:</label>
        <input type="password" class="form-control" id="password" value="password123">
      </div>
      
      <div class="mb-3">
        <label class="form-label">Role:</label>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="role" id="studentRole" value="student" checked>
          <label class="form-check-label" for="studentRole">Student</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="role" id="facultyRole" value="faculty">
          <label class="form-check-label" for="facultyRole">Faculty</label>
        </div>
      </div>
      
      <button type="submit" class="btn btn-primary">Test Registration</button>
    </form>
    
    <div id="result" class="mt-3"></div>
  </div>

  <script>
    document.getElementById('testForm').addEventListener('submit', async function(e) {
      e.preventDefault();
      
      const name = document.getElementById('name').value;
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.querySelector('input[name="role"]:checked').value;
      
      document.getElementById('result').innerHTML = '<div class="alert alert-info">Registering...</div>';
      
      try {
        const response = await fetch('http://localhost:5000/api/auth/register', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({ name, email, password, role })
        });
        
        const data = await response.json();
        
        if (response.ok) {
          document.getElementById('result').innerHTML = `
            <div class="alert alert-success">
              <h4>Registration Successful!</h4>
              <p>Token: ${data.token}</p>
              <p>User: ${JSON.stringify(data.user)}</p>
            </div>
          `;
        } else {
          document.getElementById('result').innerHTML = `
            <div class="alert alert-danger">
              <h4>Registration Failed</h4>
              <p>Error: ${data.message}</p>
            </div>
          `;
        }
      } catch (error) {
        document.getElementById('result').innerHTML = `
          <div class="alert alert-danger">
            <h4>Registration Error</h4>
            <p>Error: ${error.message}</p>
          </div>
        `;
      }
    });
  </script>
</body>
</html>
